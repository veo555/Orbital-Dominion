[project]
name = "manager-diligence"
version = "0.1.0"
description = "Selection-bias-aware statistics for evaluating (hedge fund) manager track records: PSR, MinTRL, deflated Sharpe, stationary bootstrap, Newey-West alpha, Ljung-Box smoothing flags, Holm / Benjamini-Hochberg screening"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
[tool.setuptools]
packages = ["diligence"]
