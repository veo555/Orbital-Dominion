# Fast checks for pull requests (the full gate, tests/run_all.sh, needs Playwright 1.56 + Chromium and takes ~30 min; run it locally before a release).
name: CI
on:
  push:
  pull_request:
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build is up to date (dist/ matches src/)
        run: |
          python3 build.py
          git diff --exit-code -- dist
      - run: python3 tools/design_check.py
      - run: node tests/sim/smoke.js
      - run: node tests/sim/replay.js
