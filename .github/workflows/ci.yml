# Runs every gate on each push / pull request. NOTE: written for GitHub Actions but not executed in the environment where
# it was authored (no runner available there); the commands are exactly the ones used locally -- check the first run.
name: CI
on:
  push: { branches: ['**'] }
  pull_request: {}
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.56.0 pillow
      - run: playwright install --with-deps chromium
      - run: bash tests/run_all.sh
      - name: committed dist/ matches the sources
        run: python3 build.py && git diff --exit-code -- dist
