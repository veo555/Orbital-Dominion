# Publishes the installable web app (dist/pwa, committed by `python3 build.py`) to GitHub Pages.
# One-time owner step: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Then every push that changes dist/pwa (or a manual run from the Actions tab) redeploys it.
name: Deploy to GitHub Pages
on:
  push:
    paths: ['dist/pwa/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir _site && cp -r dist/pwa/. _site/
          touch _site/.nojekyll
          test -f _site/index.html && test -f _site/sw.js && test -f _site/manifest.webmanifest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
